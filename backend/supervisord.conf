; Authored by: Mohit Singh
;
; Runs the two sibling processes of the `backend` image. They communicate ONLY through
; Postgres (see CLAUDE.md / skills_devops.md) — supervisord's only job is process lifecycle,
; never message-passing between them.

[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

[program:api]
command=node /app/api/dist/server.js
directory=/app/api
autostart=true
autorestart=true
startretries=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:worker]
command=python -m business_scout_worker.main
directory=/app
autostart=true
autorestart=true
startretries=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
