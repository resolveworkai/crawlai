# Authored by: Mohit Singh
#
# A push that fails any gate cannot merge — see CLAUDE.md "Engineering standards".
# Three codebases, three jobs (not one matrix — the toolchains are genuinely different),
# plus a docker-build job gated behind all three passing (expensive, so only run once the
# fast unit-level gates are green). `live-smoke` hits real external services (Overpass, real
# websites) — main-branch-only and `continue-on-error: true` so external flakiness never blocks
# a PR merge, per md/plans/0001-*.md's testing pyramid ("CI-gated live smoke", not a hard gate).

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    name: Frontend (lint, typecheck, test, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          NITRO_PRESET: node-server

  backend-api:
    name: Backend API — Node (lint, typecheck, test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: backend/api/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  backend-worker:
    name: Backend Worker — Python (ruff, mypy, pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy business_scout_worker tests
      - run: pytest -v

  integration-tests:
    name: Integration tests (real Postgres — schema, constraints, CRUD)
    runs-on: ubuntu-latest
    needs: [backend-api, backend-worker]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: 1234
          POSTGRES_DB: master_db_crawler
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d master_db_crawler"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:1234@localhost:5432/master_db_crawler
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: backend/api/package-lock.json
      - run: npm ci
        working-directory: backend/api
      - run: npm run migrate:up
        working-directory: backend/api
      - run: npm run test:integration
        working-directory: backend/api
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - run: pip install -e ".[dev]"
        working-directory: backend/worker
      - run: pytest -m integration -v
        working-directory: backend/worker

  live-smoke:
    name: Live smoke (real Overpass + real sites — main only, non-blocking)
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [backend-worker]
    continue-on-error: true
    defaults:
      run:
        working-directory: backend/worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - run: pip install -e ".[dev]"
      - run: pytest -m live -v

  docker-build:
    name: Build both images
    runs-on: ubuntu-latest
    needs: [frontend, backend-api, backend-worker]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
