# Authored by: Mohit Singh
#
# 2 application images (frontend, backend) + 1 dedicated Postgres instance.
# `name:` below fully isolates this project's network/volume/container namespace from any
# other docker-compose project on the same host — see .claude/skills/skills_devops.md.

name: business-scout-ai

services:
  postgres:
    image: postgres:16-alpine
    container_name: business-scout-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-1234}
      POSTGRES_DB: ${POSTGRES_DB:-master_db_crawler}
    ports:
      - "5436:5432"
    volumes:
      - business_scout_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-master_db_crawler}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      # db/migrations lives at the repo root, outside the ./backend context — passed in as a
      # named extra context so the image can bake the migrations in and apply them on start
      # (docker-entrypoint.sh). Without this, a new migration silently never reaches the
      # running dev DB and the code/schema drift apart — verified real failure, 2026-07-13.
      additional_contexts:
        migrations: ./db/migrations
    # Explicit name:tag (name + version) rather than the Compose-derived implicit
    # "business-scout-ai-backend:latest" — makes `docker images` legible and gives dev builds a
    # real, bumpable version instead of an anonymous "latest" every rebuild silently overwrites.
    image: business-scout-backend:0.1.0
    container_name: business-scout-backend
    environment:
      NODE_ENV: production
      PORT: 4000
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-1234}@postgres:5432/${POSTGRES_DB:-master_db_crawler}
      ENVIRONMENT: production
      # NODE_ENV=production makes config.ts refuse to boot with the built-in dev-default
      # secret (see auth/jwt.ts + config.ts) — this is a distinct local-only placeholder, not
      # that default, so `docker compose up` works out of the box. ⚠️ Rotate before any real
      # (non-local) deployment — see .claude/skills/skills_security.md.
      JWT_SECRET: ${JWT_SECRET:-docker-compose-local-only-jwt-secret-rotate-before-real-deploy}
      # Must match the browser-facing frontend origin — CORS requires an explicit origin
      # (not "*") because auth uses cookies with credentials:true. See auth/cookies.ts.
      FRONTEND_ORIGIN: http://localhost:3000
      # This compose file has no TLS termination (plain http://localhost) — a Secure cookie
      # is silently dropped by every browser over http://, breaking login with no visible
      # error. Override to true only once this stack sits behind real HTTPS. See config.ts.
      COOKIE_SECURE: "false"
      # Phase 5 — optional AI extraction (see llm.py). The actual on/off switch is the DB-side
      # crawl_settings.use_ai_extraction (Settings screen); these only say WHERE to send the
      # call when it's on. Defaults point at the optional `ollama` service below (free/local) —
      # override LLM_BASE_URL/LLM_API_KEY/LLM_MODEL to use Gemini/OpenAI instead. An unreachable
      # LLM_BASE_URL (e.g. ollama never started) just makes AI extraction no-op, never fails a crawl.
      LLM_BASE_URL: ${LLM_BASE_URL:-http://ollama:11434/v1}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-gemini-2.5-flash}
      # Phase 7 — generated export files (xlsx/csv/json) live on a named volume so they survive
      # a container restart; the DB row (exports table) and the file are cleaned up together on
      # the same retention schedule (server.ts).
      EXPORTS_DIR: /app/data/exports
      EXPORT_RETENTION_DAYS: ${EXPORT_RETENTION_DAYS:-7}
      # Phase 7 — public /api/v1 API keys, comma-separated. Blank by default (matching the
      # GOOGLE_API_KEY/LLM_API_KEY pattern above — never commit a real key); set in a local
      # .env to actually enable the public API for real use.
      API_KEYS: ${API_KEYS:-}
      # Crawl-OCR module — captured Google Maps screenshots live on a named volume so they
      # survive restarts; purged after OCR_CRAWL_RETENTION_DAYS (DB rows persist). BOTH the Node
      # API (reads/purges) and the Python worker (writes) resolve this same path. Headless in
      # the container (there's no display); run headful only for local non-Docker dev.
      # See ocr_engine.py: Tesseract's OpenMP threading makes it ~5.5x SLOWER on our image sizes.
      # Set here too so it applies to the whole container, not just the one module's import.
      OMP_THREAD_LIMIT: "1"
      OCR_CAPTURES_DIR: /app/data/ocr_captures
      OCR_CRAWL_RETENTION_DAYS: ${OCR_CRAWL_RETENTION_DAYS:-5}
      OCR_CRAWL_HEADLESS: ${OCR_CRAWL_HEADLESS:-true}
      # How many businesses' Tesseract OCR (Stage B) run concurrently within the one active OCR
      # job. Each call is itself single-threaded (OMP_THREAD_LIMIT=1 above); this is the knob
      # that uses multiple CPU cores across a batch. Default 3 — raise toward the container's
      # core count minus 1 if OCR still looks slow; lower to 1 to fully serialize again.
      OCR_CONCURRENCY: ${OCR_CONCURRENCY:-3}
      # Marketing / Messaging — encrypts the operator's SMTP password at rest (AES-256-GCM). Blank
      # by default (matching the GOOGLE_API_KEY/API_KEYS pattern — never commit a real key); absent
      # ⇒ email-credential save/test are disabled (wa.me/vCard still work). Set a 64-hex-char value
      # in a local .env to enable email. Generate:
      #   node -e "console.log(require('crypto').randomBytes(32).toString('hex'))"
      MESSAGING_ENCRYPTION_KEY: ${MESSAGING_ENCRYPTION_KEY:-}
      # Base URL where THIS backend's /unsubscribe route is publicly reachable — embedded in every
      # marketing email's unsubscribe footer. Defaults to the host-mapped backend port for local dev;
      # set to the real public URL in production so recipients' links resolve.
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:-http://localhost:4010}
    volumes:
      - business_scout_exports:/app/data/exports
      - business_scout_ocr_captures:/app/data/ocr_captures
    ports:
      - "4010:4000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Baked into the client bundle at BUILD time (see Dockerfile) — the browser can't
        # resolve "backend", it needs the host-mapped port. See .env.example.
        VITE_API_URL: ${VITE_API_URL:-http://localhost:4010}
    image: business-scout-frontend:0.1.0
    container_name: business-scout-frontend
    environment:
      NODE_ENV: production
      PORT: 3000
      # Reserved for a future server-side (SSR) use — not consumed by client-side code
      # (that's VITE_API_URL, a build-arg above, not a runtime env var).
      BACKEND_URL: http://backend:4000
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy

  # Optional, free local LLM for the Phase 5 AI-extraction tier. Not started by a plain
  # `docker compose up` — opt in with `docker compose --profile ai up`.
  ollama:
    image: ollama/ollama:latest
    container_name: business-scout-ollama
    profiles: ["ai"]
    volumes:
      - business_scout_ollama_data:/root/.ollama
    ports:
      - "11434:11434"

volumes:
  business_scout_postgres_data:
  business_scout_ollama_data:
  business_scout_exports:
  business_scout_ocr_captures:
